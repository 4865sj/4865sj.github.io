        <nav aria-label="Contact and academic profiles">
          <ul class="profile-links">
            <li><a href="mailto:4865sj@gmail.com">Email</a></li>

                href="https://github.com/4865sj"

  <aside class="message-card" aria-labelledby="message-card-title">
    <p class="message-label">Board</p>
    <form
      class="message-form"
      action="board.html"
      method="post"
      data-message-form="top-level"
    >
      <label
        id="message-card-title"
        class="message-title"
        for="news-message"
      >Leave a message</label>
      <textarea
        id="news-message"
        name="message"
        rows="4"
        maxlength="2000"
        aria-describedby="news-message-note news-message-count"
        data-message-body
        required
      ></textarea>
      <div class="message-form-meta">
        <span id="news-message-note" data-session-note>
          Google sign-in required.
        </span>
        <span id="news-message-count" data-message-count>0 / 2000</span>
      </div>
      <button
        class="button message-submit"
        type="submit"
        data-message-submit
        data-signed-in-label="Post to Board"
      >Sign in &amp; post</button>
      <p class="form-status" data-message-status role="status" aria-live="polite"></p>
    </form>
  </aside>

  <main id="main-content">
    <section class="content-section" aria-labelledby="news-title">
      <div class="section-layout container">
        <header class="section-heading">
          <h2 id="news-title">News</h2>
        </header>

        <div class="section-content">
          <ol class="news-list">
            <li>
              <time class="news-date" datetime="2026-08">August 2026</time>
              <span class="news-separator" aria-hidden="true">|</span>
              <p class="news-content">This wepsite is opened!</p>
            </li>
          </ol>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">

    </div>

</body>
</html>
